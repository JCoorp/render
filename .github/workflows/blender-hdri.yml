name: Generar actividad Blender HDRI
on:
  push:
    branches: [actividad-blender-hdri-20261001]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Preparar libreria EGL y Blender portable 4.0.2
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 libgl1
          curl -L --retry 4 --retry-delay 2 -o blender.tar.xz https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ./blender-4.0.2-linux-x64/blender --version
      - name: Generar blends y evidencias
        run: |
          mkdir -p blender_hdri_activity/output
          ./blender-4.0.2-linux-x64/blender --background --python blender_hdri_activity/generar.py -- --output blender_hdri_activity/output
          ls -lh blender_hdri_activity/output
      - name: Empaquetar entrega
        run: |
          cd blender_hdri_activity/output
          zip -9 -r ../../actividad_blender_hdri_entrega.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: actividad_blender_hdri_entrega
          path: actividad_blender_hdri_entrega.zip
          if-no-files-found: error
